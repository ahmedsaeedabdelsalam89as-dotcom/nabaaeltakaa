[package]
name = "fleet-desktop"
version = "1.0.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fleet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# مضافة 2026-08-21 (بند 47/49): اتصال HTTP حقيقي من داخل تطبيق سطح المكتب (لا من المتصفح) لربط
# التتبع اللحظي (Sactracking.com) — يتجاوز قيد CORS الذى يمنع أى اتصال مباشر من متصفح/صفحة ويب
# محلية (origin=null)، لأن هذا الطلب يصدر من البرنامج نفسه (عميل HTTP فى Rust) لا من نافذة متصفح.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

