name: Publish Signed Windows Release
on:
  workflow_dispatch:
  push:
    tags: ['app-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Full regression gate
        run: npm run test:all
      - name: Guardian integrity verify
        run: node scripts/naba-code-guardian.mjs --verify
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Require updater signing key
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) { throw 'TAURI_SIGNING_PRIVATE_KEY secret is required for signed updater release.' }
      - name: Build, sign and publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'نظام أسطول نبع الطاقة — إصدار __VERSION__'
          releaseBody: 'إصدار Windows موقّع ومجهز للتحديث التلقائي.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
