name: Build Windows Installer

# يعمل تلقائيًا عند رفع/تحديث الملفات على الفرع الرئيسي، أو يدويًا من تبويب Actions بالضغط على "Run workflow"
# يبني نسخة ويندوز مُوقَّعة رقميًا، وينشرها كإصدار (Release) جديد على GitHub — وهذا الإصدار هو ما يفحصه
# التطبيق المثبَّت تلقائيًا للتحقق من وجود تحديث (نظام التحديث التلقائي المدمج فى Tauri).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build, sign, and publish Release (with auto-update manifest)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "نظام أسطول نبع الطاقة — إصدار __VERSION__"
          releaseBody: "تحديث تلقائي جديد. سيتم تنزيله وتثبيته تلقائيًا على أي جهاز مثبَّت عليه البرنامج بالفعل."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
