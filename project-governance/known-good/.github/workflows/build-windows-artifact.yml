name: Build Windows Installer Artifact
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  windows-artifact:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Full regression gate
        run: npm run test:all
      - name: Guardian integrity verify
        run: node scripts/naba-code-guardian.mjs --verify
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Build unsigned NSIS installer artifact
        shell: pwsh
        run: npm run tauri build -- --config src-tauri/tauri.no-updater.conf.json
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Naba-Fleet-System-Windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
