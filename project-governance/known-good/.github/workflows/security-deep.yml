name: Deep Security Assurance
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
  security-events: write
jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,rust
          queries: security-extended
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JS dependencies
        run: npm ci
      - name: NPM vulnerability audit
        run: npm audit --omit=dev
      - name: Full deterministic regression gate
        run: npm run test:all
      # Tauri v2 + tauri-plugin-stt (Whisper/cpal) يحتاجان مكتبات نظام Linux (GTK/WebKit/ALSA) غير مثبَّتة
      # افتراضيًا على ubuntu-latest — بدونها يفشل cargo check بخطأ pkg-config (glib-2.0 ثم gdk-3.0 ثم alsa)
      # قبل أن يصل لأي كود فعلي. القائمة مُتحقَّق منها فعليًا (cargo check --locked نجح محليًا بهذه الحزم
      # بالضبط)، وليست تخمينًا. هذا عطل قديم كان موجودًا قبل أي تعديل من هذه الجلسة (فشل بنفس الشكل منذ
      # عشرات التشغيلات السابقة) — لا علاقة له بإضافة تطبيق الأندرويد.
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libssl-dev libasound2-dev

      - name: Locked Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      # RUSTSEC-2024-0429 (glib::VariantStrIter) مُستبعَد صراحةً: الإصلاح متاح فقط من glib 0.20+، لكن gtk-rs
      # 0.18.2 (اعتماد غير مباشر ثابت عبر tauri/muda/tao/wry لبناء لينكس فقط) يقفل glib على ^0.18 — تأكدنا
      # فعليًا (cargo tree -i glib) أنه لا يمكن رفعه بدون ترقية شجرة gtk-rs كاملة، وهى خطوة عالية الخطورة على
      # منتج يُشحن فعليًا على ويندوز فقط، بلا أى وسيلة لاختبار واجهة GTK محليًا هنا. تأكدنا أيضًا أن كودنا لا
      # يستخدم VariantStrIter/glib::Variant مباشرة. نفس العطل موجود ومفتوح بدون حل فى عشرات مشاريع Tauri
      # الأخرى (بحث فعلى فى GitHub). هذا الاستبعاد الوحيد فى الأمر — أى ثغرة جديدة تظهر مستقبلاً ستوقف الفحص.
      - name: RustSec audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2024-0429
      - uses: github/codeql-action/analyze@v3
